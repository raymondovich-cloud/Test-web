# .github/workflows/deploy-pages.yml — Version 1.4
name: LifeGame Preview Deploy

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - lifegame-preview
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lifegame-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Checkout LifeGame test source
        uses: actions/checkout@v4
        with:
          repository: raymondovich-cloud/LifeGame
          ref: ${{ github.event.client_payload.source_commit || 'feature/pwa-static-cache' }}
          path: lifegame-source

      - name: Build preview artifact with cache-busted assets
        shell: bash
        run: |
          set -euo pipefail
          cd lifegame-source
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          BUILD_ID="$(git rev-parse --short=12 HEAD)"
          rm -rf dist
          mkdir -p dist
          cp -R platforms/web/. dist/
          cp -R source dist/source
          find dist -type f \( -name "*.html" -o -name "*.js" \) -print0 |
            xargs -0 sed -i \
              -e 's#../../../source#../source#g' \
              -e 's#../../source#./source#g'

          export BUILD_ID SOURCE_COMMIT
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          build_id = os.environ["BUILD_ID"]
          source_commit = os.environ["SOURCE_COMMIT"]
          asset_pattern = re.compile(
              r'(?P<path>(?:https?:)?//[^"\\'\\s()]+|(?:\\.\\.?/|/)?[^"\\'\\s()=]+)\\.(?P<ext>css|js)(?:\\?[^"\\'\\s()]*)?',
              re.IGNORECASE,
          )
          js_module_specifier = re.compile(
              r"""(?P<quote>["'])(?P<path>(?:\\.\\.?/|/)[^"'\\s()=]+?)\\.js(?:\\?[^"']*)?(?P=quote)"""
          )

          for file_path in Path("dist").rglob("*"):
              if not file_path.is_file() or file_path.suffix.lower() not in {".html", ".css", ".js"}:
                  continue
              content = file_path.read_text(encoding="utf-8")
              if file_path.suffix.lower() == ".js":
                  content = js_module_specifier.sub(
                      lambda match: f"{match.group('quote')}{match.group('path')}.js?v={build_id}{match.group('quote')}",
                      content,
                  )
              else:
                  content = asset_pattern.sub(
                      lambda match: f"{match.group('path')}.{match.group('ext').lower()}?v={build_id}",
                      content,
                  )
              if file_path.name == "index.html":
                  preview_guard = r"""
          <script>
          (() => {
            const marker = document.querySelector('meta[name="lifegame-preview-build"]');
            if (!marker) return;

            let checking = false;

            async function checkPreviewBuild() {
              if (checking || document.visibilityState === "hidden") return;
              checking = true;

              try {
                const buildUrl = new URL("PREVIEW_BUILD.txt", window.location.href);
                buildUrl.searchParams.set("_", String(Date.now()));
                const response = await fetch(buildUrl.href, {
                  cache: "no-store",
                  headers: { "Cache-Control": "no-cache" }
                });
                if (!response.ok) return;

                const text = await response.text();
                const match = text.match(/^Preview build id:\s*([a-f0-9]+)/mi);
                if (!match) return;

                const latestBuild = match[1];
                if (latestBuild === marker.content) return;

                const params = new URLSearchParams(window.location.search);
                if (params.get("lg-build") === latestBuild) return;

                params.set("lg-build", latestBuild);
                const nextUrl = new URL(window.location.href);
                nextUrl.search = params.toString();
                window.location.replace(nextUrl.toString());
              } catch {
                // A failed version check must never block normal app usage.
              } finally {
                checking = false;
              }
            }

            checkPreviewBuild();
            window.setInterval(checkPreviewBuild, 60000);
            document.addEventListener("visibilitychange", () => {
              if (document.visibilityState === "visible") checkPreviewBuild();
            });
            window.addEventListener("pageshow", checkPreviewBuild);
          })();
          </script>
          """
                  preview_guard = preview_guard.strip()
                  def inject_preview_marker(match):
                      return (
                          match.group(1)
                          + f'\n    <meta name="lifegame-preview-build" content="{build_id}">'
                          + "\n    "
                          + preview_guard
                      )

                  content = re.sub(
                      r"(<head\b[^>]*>)",
                      inject_preview_marker,
                      content,
                      count=1,
                      flags=re.IGNORECASE,
                  )
              file_path.write_text(content, encoding="utf-8")

          index_content = Path("dist/index.html").read_text(encoding="utf-8")
          required_preview_markers = [
              'name="lifegame-preview-build"',
              'cache: "no-store"',
              'setInterval(checkPreviewBuild, 60000)',
              'params.set("lg-build", latestBuild)',
          ]
          missing_markers = [marker for marker in required_preview_markers if marker not in index_content]
          if missing_markers:
              raise SystemExit("Preview refresh guard is incomplete: " + ", ".join(missing_markers))

          Path("dist/PREVIEW_BUILD.txt").write_text(
              f"Preview source commit: {source_commit}\n"
              f"Preview build id: {build_id}\n"
              f"Triggered by: {os.environ.get('GITHUB_EVENT_NAME', 'unknown')}\n",
              encoding="utf-8",
          )
          PY
          test -f dist/source/presentation/auth/register.js
          test -f dist/source/presentation/auth/login.js
          grep -Fq 'register: "./source/presentation/auth/register.js?v=' dist/web.runtime.js
          grep -Fq 'login: "./source/presentation/auth/login.js?v=' dist/web.runtime.js
          touch dist/.nojekyll
          cd ..
          mv lifegame-source/dist ./dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
